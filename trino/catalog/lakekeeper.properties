# Trino connects to Lakekeeper's Iceberg REST catalog as one shared, trusted
# service identity (the "trino" Keycloak client). This is intentional: SQLPad's
# Trino driver can't do a per-user OAuth2 browser login, so Trino/SQLPad here is
# a broad-read observability tool, not a per-user-enforced engine. Per-user
# read/write enforcement is demonstrated via PySpark instead — see
# docs/initial_stack.md for the full rationale.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=local
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=trino:${ENV:TRINO_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=lakekeeper
iceberg.rest-catalog.oauth2.server-uri=http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_LAKEKEEPER_ACCESS_KEY}
s3.aws-secret-key=${ENV:MINIO_LAKEKEEPER_SECRET_KEY}
