# Declarative group membership for the lakehouse.
#
# Declares membership by company email (or `service_accounts` for machine
# identities). reconcile.py maps each group to a Lakekeeper Role and each
# email/service-account to a Lakekeeper User (resolved via Keycloak).
#
# Permissions for these groups live in grants.yaml; valid resource types and
# permission levels are defined in enums.py.
#
# Re-run after editing this file:
#   docker compose run --rm reconciler

groups:
  data-eng-writers:
    description: "Can write to core data engineering tables"
    members:
      - alice@company.com
      - bob@company.com

  sales-analytics-readonly:
    description: "Read-only access to sales reporting tables"
    members:
      - carol@company.com
      - dave@company.com

  sensitive-translation-readers:
    description: "Can read machine-translated sensitive documents"
    members:
      - erin@company.com
      - frank@company.com

  translation-pipeline-writers:
    description: "Service identity for the batch translation pipeline"
    service_accounts:
      - translation-pipeline # Keycloak client_id, not a human email

  sales-table-creators:
    description: "Can create new tables under local.sales"
    members:
      - alice@company.com

  table-definitions-writer:
    description: "Service identity for table_definitions/apply.py schema-contract deploys"
    service_accounts:
      - table-definitions # Keycloak client_id, not a human email
