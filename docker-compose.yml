name: spark-lakehouse

networks:
  lakehouse_net:
    # Pinned (compose would otherwise default to "spark-lakehouse_lakehouse_net",
    # derived from the top-level `name:` above) so DockerSpawner.network_name
    # in jupyterhub/jupyterhub_config.py has a stable value to reference.
    name: lakehouse_net

volumes:
  minio_data:
  postgres_lakekeeper_data:
  postgres_openfga_data:
  # Shared uv download cache for the one-shot bootstrap/reconciler jobs, so
  # re-running them doesn't re-fetch wheels into a throwaway container.
  uv_cache:
  jupyterhub_data:

services:
  # ─────────────────────────── Storage: MinIO ───────────────────────────
  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Lets the Lakekeeper console's browser-side DuckDB-WASM preview read
      # table data directly from MinIO. "*" is fine for this localhost-only
      # dev stack; bucket-level CORS (`mc cors`) is an AIStor-only feature,
      # so this has to be the global/server-wide setting instead.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      lakehouse_net:
        aliases:
          # One storage hostname that resolves identically inside Docker (via
          # this alias) and from your machine (browsers resolve the reserved
          # .localhost TLD to loopback per RFC 6761, hitting the published
          # port). That's what lets a single endpoint URL in the warehouse's
          # storage profile work for in-cluster clients AND the browser.
          - minio.localhost

  mc-init:
    image: ${MC_IMAGE}
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ./minio/init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_LAKEKEEPER_ACCESS_KEY: ${MINIO_LAKEKEEPER_ACCESS_KEY}
      MINIO_LAKEKEEPER_SECRET_KEY: ${MINIO_LAKEKEEPER_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      lakehouse_net:

  # ─────────────────────────── AuthN: Keycloak ───────────────────────────
  keycloak:
    image: ${KEYCLOAK_IMAGE}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Pins the issuer Keycloak stamps into every token to this one fixed
      # value, regardless of which literal hostname a given request arrived
      # through (browser-facing `localhost:8080` vs in-network
      # `keycloak:8080`). Without this, Keycloak 26's default "hostname-v2"
      # behavior derives each token's `iss` claim from whichever hostname
      # the request came in on -- so a JupyterHub login (browser hits
      # localhost:8080) mints a token with iss=localhost:8080, but
      # JupyterHub's userinfo call goes out via keycloak:8080 (the only
      # hostname reachable from inside that container) and Keycloak rejects
      # it: 401 invalid_token, "Token verification failed", because the
      # request's own hostname disagrees with the token's issuer.
      # Lakekeeper already worked around the same underlying behavior by
      # accepting BOTH issuers (LAKEKEEPER__OPENID_ADDITIONAL_ISSUERS below);
      # oauthenticator/JupyterHub has no such fallback, so pinning the
      # issuer here is the fix for that path instead.
      KC_HOSTNAME: http://localhost:8080
    command:
      [
        "start-dev",
        "--metrics-enabled=true",
        "--health-enabled=true",
        "--import-realm",
      ]
    volumes:
      - ./keycloak/realm-lakehouse.json:/opt/keycloak/data/import/realm-lakehouse.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /realms/master/.well-known/openid-configuration HTTP/1.1\r\nhost: 127.0.0.1:8080\r\nConnection: close\r\n\r\n\" >&3;grep 'jwks_uri' <&3",
        ]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      lakehouse_net:

  # ─────────────────────────── AuthZ: OpenFGA ───────────────────────────
  postgres-openfga:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_OPENFGA_PASSWORD}
      POSTGRES_DB: openfga
    volumes:
      - postgres_openfga_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openfga"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks:
      lakehouse_net:

  openfga-migrate:
    image: ${OPENFGA_IMAGE}
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:${POSTGRES_OPENFGA_PASSWORD}@postgres-openfga:5432/openfga?sslmode=disable
    depends_on:
      postgres-openfga:
        condition: service_healthy
    restart: "no"
    networks:
      lakehouse_net:

  openfga:
    image: ${OPENFGA_IMAGE}
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:${POSTGRES_OPENFGA_PASSWORD}@postgres-openfga:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "3001:3000" # Playground UI (dev/observability console into the authz model & tuples)
    depends_on:
      postgres-openfga:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 3s
      timeout: 10s
      retries: 20
    networks:
      lakehouse_net:

  # ─────────────────────────── Catalog: Lakekeeper ───────────────────────────
  postgres-lakekeeper:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_LAKEKEEPER_PASSWORD}
      POSTGRES_DB: lakekeeper
    volumes:
      - postgres_lakekeeper_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lakekeeper"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks:
      lakehouse_net:

  lakekeeper-migrate:
    image: ${LAKEKEEPER_IMAGE}
    pull_policy: always
    entrypoint: ["/home/nonroot/lakekeeper", "migrate"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:${POSTGRES_LAKEKEEPER_PASSWORD}@postgres-lakekeeper:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:${POSTGRES_LAKEKEEPER_PASSWORD}@postgres-lakekeeper:5432/lakekeeper
      LAKEKEEPER__AUTHZ_BACKEND: openfga
      LAKEKEEPER__OPENFGA__ENDPOINT: http://openfga:8081
    depends_on:
      postgres-lakekeeper:
        condition: service_healthy
      openfga:
        condition: service_healthy
    restart: "no"
    networks:
      lakehouse_net:

  lakekeeper:
    image: ${LAKEKEEPER_IMAGE}
    pull_policy: always
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:${POSTGRES_LAKEKEEPER_PASSWORD}@postgres-lakekeeper:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:${POSTGRES_LAKEKEEPER_PASSWORD}@postgres-lakekeeper:5432/lakekeeper
      LAKEKEEPER__AUTHZ_BACKEND: openfga
      LAKEKEEPER__OPENFGA__ENDPOINT: http://openfga:8081
      LAKEKEEPER__OPENID_PROVIDER_URI: http://keycloak:8080/realms/lakehouse
      LAKEKEEPER__OPENID_ADDITIONAL_ISSUERS: http://localhost:8080/realms/lakehouse
      LAKEKEEPER__OPENID_AUDIENCE: lakekeeper
      LAKEKEEPER__UI__OPENID_CLIENT_ID: lakekeeper-ui
      LAKEKEEPER__UI__OPENID_PROVIDER_URI: http://localhost:8080/realms/lakehouse
    ports:
      - "8181:8181" # REST catalog + management API + bundled console + /swagger-ui/
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      postgres-lakekeeper:
        condition: service_healthy
      mc-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 20
      start_period: 5s
    networks:
      lakehouse_net:

  bootstrap:
    image: ${UV_IMAGE}
    working_dir: /app
    # uv + the project's locked pyproject.toml/uv.lock. The venv goes outside
    # /app because the project is mounted read-only.
    command:
      ["sh", "-c", "uv sync --frozen --no-dev && uv run python bootstrap.py"]
    volumes:
      - ./lakekeeper:/app:ro
      - uv_cache:/uv-cache
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /uv-cache
      LAKEKEEPER_URL: http://lakekeeper:8181
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token
      KEYCLOAK_ADMIN_API_URL: http://keycloak:8080/admin/realms/lakehouse
      RECONCILER_CLIENT_ID: reconciler
      RECONCILER_CLIENT_SECRET: ${RECONCILER_CLIENT_SECRET}
      ADMIN_EMAIL: vkieuvongngam@gmail.com
      WAREHOUSE_NAME: ${LAKEKEEPER_WAREHOUSE_NAME}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # This endpoint is stored in the warehouse's storage profile and handed
      # to every client, including the browser (console preview) — so it must
      # resolve both inside Docker and outside it. "minio.localhost" does:
      # a network alias covers in-cluster clients, and browsers resolve the
      # reserved .localhost TLD to loopback (RFC 6761) → published port 9000.
      MINIO_ENDPOINT: http://minio.localhost:9000
      MINIO_LAKEKEEPER_ACCESS_KEY: ${MINIO_LAKEKEEPER_ACCESS_KEY}
      MINIO_LAKEKEEPER_SECRET_KEY: ${MINIO_LAKEKEEPER_SECRET_KEY}
    depends_on:
      lakekeeper:
        condition: service_healthy
    restart: "no"
    networks:
      lakehouse_net:

  # ─────────────────────────── Query: Trino + SQLPad ───────────────────────────
  trino:
    image: ${TRINO_IMAGE}
    environment:
      TRINO_CLIENT_SECRET: ${TRINO_CLIENT_SECRET}
      MINIO_LAKEKEEPER_ACCESS_KEY: ${MINIO_LAKEKEEPER_ACCESS_KEY}
      MINIO_LAKEKEEPER_SECRET_KEY: ${MINIO_LAKEKEEPER_SECRET_KEY}
    volumes:
      - ./trino/catalog/lakekeeper.properties:/etc/trino/catalog/lakekeeper.properties:ro
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8080/v1/status"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 10s
    depends_on:
      lakekeeper:
        condition: service_healthy
    networks:
      lakehouse_net:

  sqlpad:
    image: ${SQLPAD_IMAGE}
    environment:
      SQLPAD_ADMIN: ${SQLPAD_ADMIN}
      SQLPAD_ADMIN_PASSWORD: ${SQLPAD_ADMIN_PASSWORD}
      SQLPAD_DEFAULT_CONNECTION_ID: lakekeeper
      SQLPAD_CONNECTIONS__lakekeeper__name: Lakekeeper (via Trino)
      SQLPAD_CONNECTIONS__lakekeeper__driver: trino
      SQLPAD_CONNECTIONS__lakekeeper__host: trino
      SQLPAD_CONNECTIONS__lakekeeper__port: "8080"
      SQLPAD_CONNECTIONS__lakekeeper__username: trino
      SQLPAD_CONNECTIONS__lakekeeper__catalog: lakekeeper
    ports:
      - "3000:3000"
    depends_on:
      trino:
        condition: service_healthy
    networks:
      lakehouse_net:

  # ─────────────────────────── Access control: reconciler ───────────────────────────
  # Not started by `docker compose up`. Run explicitly and re-run any time
  # reconciler/grants.yaml changes:
  #   docker compose run --rm reconciler
  reconciler:
    image: ${UV_IMAGE}
    working_dir: /app
    # uv + the project's locked pyproject.toml/uv.lock. The venv goes outside
    # /app because the project is mounted read-only.
    command:
      ["sh", "-c", "uv sync --frozen --no-dev && uv run python reconcile.py"]
    volumes:
      - ./reconciler:/app:ro
      - uv_cache:/uv-cache
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /uv-cache
      LAKEKEEPER_URL: http://lakekeeper:8181
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token
      KEYCLOAK_ADMIN_API_URL: http://keycloak:8080/admin/realms/lakehouse
      RECONCILER_CLIENT_ID: reconciler
      RECONCILER_CLIENT_SECRET: ${RECONCILER_CLIENT_SECRET}
      WAREHOUSE_NAME: ${LAKEKEEPER_WAREHOUSE_NAME}
    profiles: ["tools"]
    networks:
      lakehouse_net:

  # ─────────────────────────── Spark: standalone cluster ───────────────────────────
  # spark-master and spark-worker share one image (built once, `target: base`
  # in spark/docker/Dockerfile) with Iceberg's Spark-runtime + AWS-bundle jars
  # baked into $SPARK_HOME/jars, so driver/worker classpaths can never skew.
  # Total shared capacity: 2 workers x 4 cores = 8 cores. JupyterHub's
  # Small/Medium/Large spawn profiles just cap how many of those 8 cores a
  # given session's driver asks for via spark.cores.max -- see
  # docs/team_jupyter_hub.ipynb.
  spark-master:
    build:
      context: ./spark
      dockerfile: docker/Dockerfile
      target: base
    image: ${SPARK_CLUSTER_IMAGE}
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.master.Master",
        "--host",
        "spark-master",
        "--port",
        "7077",
        "--webui-port",
        "8080",
      ]
    ports:
      - "8082:8080" # Master web UI (8080 is taken by Keycloak on the host)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      lakehouse_net:

  spark-worker:
    build:
      context: ./spark
      dockerfile: docker/Dockerfile
      target: base
    image: ${SPARK_CLUSTER_IMAGE}
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "--cores",
        "4",
        "--memory",
        "4g",
        "--webui-port",
        "8081",
        "spark://spark-master:7077",
      ]
    deploy:
      replicas: 2
    # No published ports: replicas can't share one host mapping, and there's
    # no need for host access to a worker's own UI (the master UI at :8082
    # shows aggregate worker/executor state).
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      lakehouse_net:

  # Not started by `docker compose up` (no long-running command). Exists so
  # `docker compose build spark-notebook` produces a stable, predictable
  # image tag for jupyterhub/jupyterhub_config.py's DockerSpawner to
  # reference -- naming a service explicitly on the build/run CLI bypasses
  # profile gating, so this still builds even though it's in the "tools"
  # profile like reconciler above.
  spark-notebook:
    build:
      context: ./spark
      dockerfile: docker/Dockerfile
      target: notebook
    image: ${SPARK_NOTEBOOK_IMAGE}
    profiles: ["tools"]
    networks:
      lakehouse_net:

  # ─────────────────────────── JupyterHub: multi-user notebooks ───────────────────────────
  jupyterhub:
    build:
      context: ./jupyterhub
    image: lakehouse/jupyterhub:latest
    ports:
      - "8000:8000"
    volumes:
      # DockerSpawner needs the Docker API to launch per-user containers.
      # Root-equivalent host access -- a deliberate dev-only tradeoff, see
      # docs/team_jupyter_hub.ipynb "Security tradeoffs".
      - /var/run/docker.sock:/var/run/docker.sock
      # A subdirectory, not /srv/jupyterhub itself: that's also where the
      # Dockerfile COPYs jupyterhub_config.py, and Docker seeds a named
      # volume from the image's content at its mount point only once, on
      # first creation -- mounting the whole directory would silently shadow
      # every future image rebuild's config with that first-run snapshot.
      - jupyterhub_data:/srv/jupyterhub/state
    environment:
      JUPYTERHUB_CLIENT_ID: jupyterhub
      JUPYTERHUB_CLIENT_SECRET: ${JUPYTERHUB_CLIENT_SECRET}
      OAUTH2_AUTHORIZE_URL: http://localhost:8080/realms/lakehouse/protocol/openid-connect/auth
      OAUTH2_TOKEN_URL: http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token
      OAUTH2_USERDATA_URL: http://keycloak:8080/realms/lakehouse/protocol/openid-connect/userinfo
      OAUTH_CALLBACK_URL: http://localhost:8000/hub/oauth_callback
      SPARK_NOTEBOOK_IMAGE: ${SPARK_NOTEBOOK_IMAGE}
      DOCKER_NETWORK_NAME: lakehouse_net
    depends_on:
      keycloak:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    networks:
      lakehouse_net:
